model:
  name: Qwen/Qwen3-0.6B
  device: cuda
  dtype: bfloat16
data:
  dataset_name: fineweb_edu
  batch_size: 64
  num_samples: 4096
  val_samples: 128
  max_length: 4096
  num_workers: 8
  seed: 0
  shuffle_seed: 1234
  shuffle_buffer_size: 100000
quantization:
  gsq_bits: 2
  init_method: nowag_d1
  gsq_enabled: true
  start_layer: 0
  self_attn: true
  std: 0.01
  temperature: [2.0, 0.05]
  scale: [100, 500]
  groupsize: 128
  strength: 6
  logits_dtype: float32
  nowag_hessian_weight_mode: original_corrected
  nowag_scale_init: absmax
  nowag_scale_training: trust_region
  nowag_scale_ratio_min: 0.6666666667
  nowag_scale_ratio_max: 1.5
  nowag_scale_warmup_epochs: 2
  nowag_codebook_trainable: false
  nowag_norm_trainable: false
  nowag_norm_ratio_min: 0.9
  nowag_norm_ratio_max: 1.1
  nowag_codebook_aware_gptq: false
  nowag_lloyd_iters: 100
  nowag_seed: 0
  nowag_eps: 1.0e-8
  nowag_inline_steps: 2000
training:
  num_epochs: 20
  device_microbatch_size: 4
  lr1: 0.0001
  lr2: 0.00001
  nowag_codebook_lr: 0.000001
  nowag_norm_lr: 0.000001
  weight_decay: 1.0
  checkpoint_dir: experiments/results/20260716_032000_formal_qwen3_06b_g3_nowag_g128
  log_dir: experiments/logs/20260716_032000_formal_qwen3_06b_g3_nowag_g128
  eval_baseline: false
  ppl_eval_every_n_layers: 0
gptq:
  nsamples: 512
  wbits: 2
  sym: true
  trits: false
  percdamp: 0.1
  blocksize: 128
  groupsize: 128
  static_groups: false
  prunen: 0
  prunem: 0
  skip: false
distributed: {timeout_hours: 24.0}
wandb: {enabled: false}

